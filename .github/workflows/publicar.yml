# Publica el repo tal cual en GitHub Pages.
#
# POR QUÉ ESTE WORKFLOW Y NO EL PIPELINE «legacy» DE PAGES: el legacy daba «Page build failed»
# en cada intento y aun así servía la página (1/9/2026). Un pipeline que falla y sirve es peor
# que uno que falla: no se puede saber si el próximo cambio salió. Aquí cada publicación deja
# una ejecución con su log, y si falla, falla en rojo.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: despliegue
        uses: actions/deploy-pages@v4
